apiVersion: 1

datasources:
  # The fixed uid matters: every provisioned dashboard references this datasource by uid, and a
  # generated uid would leave all panels unbound.
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 10s
